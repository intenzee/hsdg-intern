services:
  db:
    image: postgres:16
    container_name: ca_firm_mis_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ca_firm_mis
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ca_firm_mis_api
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/ca_firm_mis
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # The frontend calls the API via the HOST machine's port 8000.
        # When running inside Docker, the browser (on the host) reaches
        # the API at localhost:8000, not at the container name "api".
        VITE_API_URL: http://localhost:8000
    container_name: ca_firm_mis_frontend
    ports:
      - "3000:80"
    depends_on:
      - api

volumes:
  postgres_data:
